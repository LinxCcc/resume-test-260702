<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="description" content="个人作品集访问验证">
    <link rel="icon" type="image/svg+xml" href="/login-assets/favicon.svg">
    <title>Nice to meet you! 👋</title>
    <style>
      @font-face {
        font-family: 'SignPainter Web';
        src: url('/login-assets/signpainter-housescript.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      :root {
        --blue: #0f6bff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      html {
        background: #e7effc;
      }

      body {
        margin: 0;
        color: #071a3b;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }

      p {
        white-space: pre-line;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        background: none;
      }

      [hidden] {
        display: none !important;
      }

      .base-icon {
        display: block;
        width: 1em;
        height: 1em;
      }

      .toast {
        position: fixed;
        top: calc(24px + env(safe-area-inset-top));
        left: 50%;
        z-index: 300;
        width: min(calc(100% - 32px), 420px);
        padding: 13px 18px;
        border: 1px solid rgba(209, 66, 66, 0.18);
        border-radius: 14px;
        color: #a82929;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
        background: rgba(255, 245, 245, 0.96);
        box-shadow: 0 16px 40px rgba(122, 36, 36, 0.16);
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -12px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        backdrop-filter: blur(14px);
      }

      .toast.visible {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .enter-button:disabled {
        cursor: wait;
        opacity: 0.68;
      }
    </style>
    <link rel="stylesheet" href="/login-assets/welcome.css">
  </head>
  <body>
    <div id="toast" class="toast" role="status" aria-live="assertive"></div>

    <div class="app-shell immersive-shell">
      <main class="welcome-page">
        <div class="welcome-orb welcome-orb-two" aria-hidden="true"></div>

        <section class="welcome-layout">
          <div class="welcome-visual" aria-hidden="true">
            <div class="welcome-dot-grid"></div>
            <span class="welcome-spark welcome-spark-one">✦</span>
            <span class="welcome-spark welcome-spark-two">✦</span>
            <img
              class="welcome-avatar"
              src="/login-assets/avatar.png"
              alt=""
            >
          </div>

          <div class="welcome-content">
            <div class="welcome-heading">
              <p>Welcome</p>
              <h1>Nice to meet you! 👋</h1>
            </div>

            <div class="welcome-divider" aria-hidden="true">
              <span></span>
              <i></i>
            </div>

            <p class="welcome-intro">这是一个由我与 AI 共同完成的个人网站，很高兴在此遇见你。为保护个人隐私，请输入邀请码后继续访问。Thank you for your time！</p>

            <form id="invite-form" class="invite-form" novalidate>
              <label id="invite-field" class="invite-field">
                <img
                  class="access-lock-icon"
                  src="/login-assets/lock.svg"
                  alt=""
                  aria-hidden="true"
                >
                <span class="sr-only">邀请码</span>
                <input
                  id="password"
                  type="password"
                  name="password"
                  autocomplete="current-password"
                  placeholder="请输入邀请码"
                  aria-describedby="invite-error"
                  required
                >
                <button
                  id="password-toggle"
                  class="invite-visibility"
                  type="button"
                  aria-label="查看邀请码"
                  title="查看邀请码"
                >
                  <svg
                    id="eye-icon"
                    class="base-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M2.8 12s3.2-5.5 9.2-5.5 9.2 5.5 9.2 5.5-3.2 5.5-9.2 5.5S2.8 12 2.8 12Z"></path>
                    <circle cx="12" cy="12" r="2.5"></circle>
                  </svg>
                  <svg
                    id="eye-off-icon"
                    class="base-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    hidden
                  >
                    <path d="m4 4 16 16"></path>
                    <path d="M10.6 6.6c.5-.1.9-.1 1.4-.1 6 0 9.2 5.5 9.2 5.5a15.8 15.8 0 0 1-2.3 3"></path>
                    <path d="M6.1 7.5A15.7 15.7 0 0 0 2.8 12s3.2 5.5 9.2 5.5c1 0 1.9-.2 2.7-.4"></path>
                    <path d="M10.2 10.2a2.5 2.5 0 0 0 3.6 3.6"></path>
                  </svg>
                </button>
              </label>

              <p
                id="invite-error"
                class="invite-error"
                role="alert"
                hidden
              ></p>

              <button id="submit-button" class="enter-button" type="submit">
                <span id="submit-label">进入我的空间</span>
                <span class="enter-arrow" aria-hidden="true">→</span>
              </button>
            </form>

            <a
              class="welcome-project-link"
              href="https://my.feishu.cn/docx/FMbGdLzuOoQGcmxRz4rcjD29nLh?from=from_copylink"
              target="_blank"
              rel="noopener noreferrer"
            >🍟 关于本项目的介绍 🍣</a>
          </div>
        </section>

        <footer
          class="site-footer site-footer-welcome"
          style="display: __ICP_VISIBILITY__"
        >
          <a
            href="https://beian.miit.gov.cn/"
            rel="noopener noreferrer"
            target="_blank"
          >__ICP_NUMBER__</a>
        </footer>
      </main>
    </div>

    <script nonce="__SCRIPT_NONCE__">
      const form = document.querySelector('#invite-form')
      const field = document.querySelector('#invite-field')
      const passwordInput = document.querySelector('#password')
      const passwordToggle = document.querySelector('#password-toggle')
      const eyeIcon = document.querySelector('#eye-icon')
      const eyeOffIcon = document.querySelector('#eye-off-icon')
      const errorMessage = document.querySelector('#invite-error')
      const submitButton = document.querySelector('#submit-button')
      const submitLabel = document.querySelector('#submit-label')
      const toast = document.querySelector('#toast')
      let toastTimer

      const showToast = (message) => {
        window.clearTimeout(toastTimer)
        toast.textContent = message
        toast.classList.add('visible')
        toastTimer = window.setTimeout(() => {
          toast.classList.remove('visible')
        }, 4200)
      }

      const setError = (message = '') => {
        errorMessage.textContent = message
        errorMessage.hidden = !message
        field.classList.toggle('invalid', Boolean(message))
      }

      passwordToggle.addEventListener('click', () => {
        const shouldShow = passwordInput.type === 'password'
        passwordInput.type = shouldShow ? 'text' : 'password'
        eyeIcon.hidden = shouldShow
        eyeOffIcon.hidden = !shouldShow
        passwordToggle.setAttribute(
          'aria-label',
          shouldShow ? '隐藏邀请码' : '查看邀请码'
        )
        passwordToggle.setAttribute(
          'title',
          shouldShow ? '隐藏邀请码' : '查看邀请码'
        )
      })

      passwordInput.addEventListener('input', () => {
        setError()
      })

      form.addEventListener('submit', async (event) => {
        event.preventDefault()

        if (!passwordInput.value) {
          setError('请先输入邀请码')
          passwordInput.focus()
          return
        }

        submitButton.disabled = true
        submitLabel.textContent = '正在验证'

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({
              password: passwordInput.value,
              returnTo: new URLSearchParams(window.location.search).get('returnTo')
            })
          })
          const contentType = response.headers.get('content-type') || ''
          const result = contentType.includes('application/json')
            ? await response.json()
            : {}

          if (!response.ok) {
            const message = result.message || (
              response.status === 429
                ? '请求过于频繁，请稍后再试。'
                : '验证失败，请稍后重试。'
            )

            if (response.status === 429) {
              showToast(message)
            }
            throw new Error(message)
          }

          passwordInput.value = ''
          window.location.replace(result.redirectTo || '/loading')
        } catch (error) {
          setError(error.message)
          passwordInput.focus()
        } finally {
          submitButton.disabled = false
          submitLabel.textContent = '进入我的空间'
        }
      })
    </script>
  </body>
</html>
